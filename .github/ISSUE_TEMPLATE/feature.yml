name: Funcionalidade para o agente
description: Descreva uma mudança verificável no catálogo
title: '[feature] '
labels: ['type:feature', 'status:triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema e resultado esperado
      description: Explique o comportamento atual e o que deve mudar.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      placeholder: |
        - [ ] O endpoint aceita o novo filtro.
        - [ ] Há testes para resultados vazios e parâmetros inválidos.
        - [ ] A documentação OpenAPI foi atualizada.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo e restrições
      placeholder: Preserve a paginação atual. Altere apenas a API e seus testes.
    validations:
      required: true
  - type: markdown
    attributes:
      value: 'Catálogo e exemplos em [docs/skills-catalog.md](https://github.com/lucasnscr/issue-to-pr-ai/blob/main/docs/skills-catalog.md). A seleção acrescenta práticas aos padrões de cada fase; não amplia permissões.'
  - type: dropdown
    id: skills
    attributes:
      label: Skills
      description: Opcional. Escolha até oito IDs; deixe vazio para usar os padrões de cada fase.
      multiple: true
      options:
        - java-spring-api
        - postgres-flyway
        - integration-tests
        - code-review
        - grill-me
        - superpowers
        - superpowers-writing-plans
        - superpowers-test-driven-development
        - superpowers-systematic-debugging
        - superpowers-verification-before-completion
        - graphify
  - type: markdown
    attributes:
      value: 'Opcional: com AI_SPEC_ENABLED=true, um colaborador comenta `/ai-spec` para refinar requisitos. Para implementar, revisa os critérios, adiciona `ai:ready` e comenta `/oc implemente esta issue` ou `@claude implemente esta issue`.'
