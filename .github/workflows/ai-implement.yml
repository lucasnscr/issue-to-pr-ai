name: AI implementation
run-name: 'AI implementation • issue #${{ github.event.issue.number }}'
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: ai-implementation-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  authorize:
    if: vars.AI_ENABLED == 'true' && github.event.comment.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      agent: ${{ steps.gate.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const authorize = require('./.github/scripts/authorize.cjs');
            await authorize({ github, context, core });
  implement:
    needs: authorize
    if: >-
      needs.authorize.outputs.agent == 'opencode' ||
      (needs.authorize.outputs.agent == 'claude' && vars.CLAUDE_ENABLED == 'true')
    runs-on: ${{ fromJSON(vars.AI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
    env:
      MODEL: ${{ needs.authorize.outputs.agent == 'claude' && (vars.CLAUDE_MODEL || 'anthropic/claude-sonnet-4-6') || (vars.OPENCODE_MODEL || 'anthropic/claude-sonnet-4-6') }}
    outputs:
      issue: ${{ steps.task.outputs.issue }}
      base_ref: ${{ steps.task.outputs.base_ref }}
      base_sha: ${{ steps.task.outputs.base_sha }}
      branch: ${{ steps.task.outputs.branch }}
      selected_skills: ${{ steps.task.outputs.selected_skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Identify the trusted base
        run: echo "CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Re-authorize and prepare the issue
        id: task
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prepare = require('./.github/scripts/prepare-implementation.cjs');
            await prepare({ github, context, core });
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Prepare graph from the trusted base when selected
        uses: ./.github/actions/prepare-skill-graph
        with:
          manifest: ${{ steps.task.outputs.skills_manifest }}
          target: ${{ steps.task.outputs.task }}
          kind: implementation
      - name: Preserve skill provenance
        run: |
          mkdir -p artifacts
          cp "$RUNNER_TEMP/implementation-skills.json" artifacts/skills-manifest.json
          if [ -f "$RUNNER_TEMP/graph-context.json" ]; then cp "$RUNNER_TEMP/graph-context.json" artifacts/graph-context.json; fi
      - name: Install pinned OpenCode
        if: needs.authorize.outputs.agent == 'opencode'
        run: npm install --global opencode-ai@1.19.3
      - name: Install pinned Claude Code
        if: needs.authorize.outputs.agent == 'claude'
        run: npm install --global @anthropic-ai/claude-code@2.1.306
      - name: Preserve independent scope and acceptance validators
        run: |
          cp scripts/validate-agent-changes.mjs "$RUNNER_TEMP/validate-agent-changes.mjs"
          cp scripts/category-acceptance.mjs "$RUNNER_TEMP/category-acceptance.mjs"
          cp scripts/price-acceptance.mjs "$RUNNER_TEMP/price-acceptance.mjs"
          cp scripts/ordering-acceptance.mjs "$RUNNER_TEMP/ordering-acceptance.mjs"
      - id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Implement without a GitHub write token
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VLLM_BASE_URL: ${{ vars.VLLM_BASE_URL }}
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          TASK_FILE: ${{ steps.task.outputs.task }}
          IMPLEMENTATION_AGENT: ${{ needs.authorize.outputs.agent }}
        run: node scripts/run-implementation.mjs
      - name: Check scope before executing generated code
        env:
          EXPECTED_SHA: ${{ steps.task.outputs.base_sha }}
        run: node "$RUNNER_TEMP/validate-agent-changes.mjs"
      - name: Preserve candidate for failed-test diagnosis
        run: git diff --cached --binary > artifacts/candidate.patch
      - name: Unit and real PostgreSQL integration tests
        id: tests
        run: ./mvnw -B -ntp verify
      - name: Full application in Docker with independent HTTP acceptance
        env:
          ACCEPTANCE_PROFILE: ${{ vars.AI_ACCEPTANCE_PROFILE || 'full' }}
        run: |
          trap 'docker compose logs --no-color; docker compose down -v' EXIT
          docker build -t catalog-api:0.1.0 .
          docker compose up --no-build -d
          node scripts/smoke.mjs
          node "$RUNNER_TEMP/category-acceptance.mjs"
          case "$ACCEPTANCE_PROFILE" in
            category) ;;
            price) node "$RUNNER_TEMP/price-acceptance.mjs" ;;
            full)
              node "$RUNNER_TEMP/price-acceptance.mjs"
              node "$RUNNER_TEMP/ordering-acceptance.mjs"
              ;;
            *) printf 'Unknown acceptance profile\n' >&2; exit 1 ;;
          esac
      - name: Package validated implementation
        run: |
          git diff --exit-code
          git diff --cached --binary > artifacts/implementation.patch
          test -s artifacts/implementation.patch
      - name: Record execution and usage
        if: always() && steps.started.outcome == 'success'
        env:
          AGENT: ${{ needs.authorize.outputs.agent }}
          STARTED_AT: ${{ steps.started.outputs.epoch }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/run-summary.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.started.outcome == 'success'
        with:
          name: implementation-${{ github.run_id }}
          path: |
            artifacts/
            apps/catalog-api/target/surefire-reports/
            apps/catalog-api/target/failsafe-reports/
          retention-days: 14
  publish:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: implementation-${{ github.run_id }}
          path: downloaded
      - name: Apply and verify the patch in a fresh runner
        env:
          EXPECTED_SHA: ${{ needs.implement.outputs.base_sha }}
        run: |
          mv downloaded "$RUNNER_TEMP/implementation-artifacts"
          git apply --check "$RUNNER_TEMP/implementation-artifacts/artifacts/implementation.patch"
          git apply --index "$RUNNER_TEMP/implementation-artifacts/artifacts/implementation.patch"
          node scripts/validate-agent-changes.mjs
      - name: Publish a draft PR and explicitly start CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.implement.outputs.branch }}
          BASE_REF: ${{ needs.implement.outputs.base_ref }}
          ISSUE_NUMBER: ${{ needs.implement.outputs.issue }}
          SELECTED_SKILLS: ${{ needs.implement.outputs.selected_skills }}
          CATALOG_COMMIT: ${{ needs.implement.outputs.base_sha }}
        run: |
          node scripts/install-git-hooks.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git switch -c "$BRANCH"
          git commit -m "feat: implement issue #$ISSUE_NUMBER with validated AI output"
          git push origin "$BRANCH"
          {
            printf 'Implementa os critérios da issue #%s.\n\nCloses #%s\n\n' "$ISSUE_NUMBER" "$ISSUE_NUMBER"
            printf 'Validação antes da publicação: Maven com PostgreSQL real, Docker, smoke e critérios HTTP independentes.\n\n'
            printf 'Execução e consumo: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Revisão humana necessária. A IA não aprovou nem integrou esta PR.\n'
          } > "$RUNNER_TEMP/pr.md"
          node scripts/publish-skill-selection.cjs "$RUNNER_TEMP/pr.md"
          PR_URL=$(gh pr create --draft --base "$BASE_REF" --head "$BRANCH" --title "feat: implement issue #$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/pr.md")
          PR_NUMBER=${PR_URL##*/}
          gh pr edit "$PR_NUMBER" --add-label ai:ready
          AUTOFIX=$(gh issue view "$ISSUE_NUMBER" --json state,labels --jq '.state == "OPEN" and ([.labels[].name] | index("ai:ready") != null) and ([.labels[].name] | index("ai:autofix") != null)')
          if [ "$AUTOFIX" = true ]; then
            gh pr edit "$PR_NUMBER" --add-label ai:autofix
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run ai-review.yml --ref "$BASE_REF" -f pull_request="$PR_NUMBER"
