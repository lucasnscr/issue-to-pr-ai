name: AI live test
on:
  push:
    branches: [ai/live-test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-live-test
  cancel-in-progress: false
jobs:
  implement:
    if: vars.AI_LIVE_TEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
    env:
      MODEL: ${{ vars.OPENCODE_MODEL || 'anthropic/claude-sonnet-4-6' }}
    outputs:
      issue: ${{ steps.task.outputs.issue }}
      base_ref: ${{ steps.task.outputs.base_ref }}
      base_sha: ${{ steps.task.outputs.base_sha }}
      branch: ${{ steps.task.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize and load the real issue
        id: task
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LIVE_TEST_ISSUE: ${{ vars.AI_LIVE_TEST_ISSUE }}
          LIVE_TEST_BASE_REF: ${{ vars.AI_LIVE_TEST_BASE_REF }}
        with:
          script: |
            const prepare = require('./.github/scripts/prepare-live-test.cjs');
            await prepare({ github, context, core });
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned OpenCode and preserve trusted validators
        run: |
          npm install --global opencode-ai@1.19.3
          cp scripts/validate-agent-changes.mjs "$RUNNER_TEMP/validate-agent-changes.mjs"
          cp scripts/implementation-profiles.mjs "$RUNNER_TEMP/implementation-profiles.mjs"
          cp scripts/category-acceptance.mjs "$RUNNER_TEMP/category-acceptance.mjs"
      - id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Implement with the real model without a GitHub write token
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK_FILE: ${{ steps.task.outputs.task }}
        run: node scripts/run-live-test.mjs
      - name: Check scope before executing the generated code
        env:
          EXPECTED_SHA: ${{ steps.task.outputs.base_sha }}
        run: node "$RUNNER_TEMP/validate-agent-changes.mjs"
      - name: Preserve the candidate patch for diagnosing failed validations
        run: git diff --cached --binary > artifacts/candidate.patch
      - name: Run unit and real PostgreSQL integration tests
        id: tests
        run: ./mvnw -B -ntp verify
      - name: Verify the independent acceptance criteria in Docker
        run: |
          trap 'docker compose logs --no-color; docker compose down -v' EXIT
          docker build -t catalog-api:0.1.0 .
          docker compose up --no-build -d
          node scripts/smoke.mjs
          node "$RUNNER_TEMP/category-acceptance.mjs"
      - name: Package the validated implementation
        run: |
          git diff --exit-code
          git diff --cached --binary > artifacts/implementation.patch
          test -s artifacts/implementation.patch
      - name: Record execution
        if: always() && steps.started.outcome == 'success'
        env:
          AGENT: opencode-live-implementer
          STARTED_AT: ${{ steps.started.outputs.epoch }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/run-summary.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.started.outcome == 'success'
        with:
          name: live-implementation
          path: |
            artifacts/
            apps/catalog-api/target/surefire-reports/
            apps/catalog-api/target/failsafe-reports/
          retention-days: 14
  publish:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # A fresh runner publishes the patch without executing agent-modified scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.implement.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-implementation
          path: downloaded
      - name: Apply the validated patch
        env:
          EXPECTED_SHA: ${{ needs.implement.outputs.base_sha }}
        run: |
          cp scripts/validate-agent-changes.mjs "$RUNNER_TEMP/validate-agent-changes.mjs"
          cp scripts/implementation-profiles.mjs "$RUNNER_TEMP/implementation-profiles.mjs"
          mv downloaded "$RUNNER_TEMP/live-artifacts"
          git apply --check "$RUNNER_TEMP/live-artifacts/artifacts/implementation.patch"
          git apply --index "$RUNNER_TEMP/live-artifacts/artifacts/implementation.patch"
          node "$RUNNER_TEMP/validate-agent-changes.mjs"
      - name: Commit, push, and create a draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.implement.outputs.branch }}
          BASE_REF: ${{ needs.implement.outputs.base_ref }}
          ISSUE_NUMBER: ${{ needs.implement.outputs.issue }}
        run: |
          node scripts/install-git-hooks.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git switch -c "$BRANCH"
          git commit -m "feat: implement category filter for issue #$ISSUE_NUMBER"
          git push origin "$BRANCH"
          {
            printf 'Implementa o filtro de categoria solicitado na issue #%s.\n\n' "$ISSUE_NUMBER"
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            printf 'Validação: testes unitários e PostgreSQL real, build Docker e critérios de aceite HTTP independentes aprovados.\n\n'
            printf 'Execução: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Gerado por OpenCode com o modelo configurado no workflow AI live test. Revisão humana necessária.\n'
          } > "$RUNNER_TEMP/live-pr.md"
          gh pr create --draft --base "$BASE_REF" --head "$BRANCH" \
            --title "feat: category filter from issue #$ISSUE_NUMBER" \
            --body-file "$RUNNER_TEMP/live-pr.md"
