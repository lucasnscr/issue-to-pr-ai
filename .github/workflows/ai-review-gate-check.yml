name: AI review gate check
run-name: 'AI review gate PR #${{ github.event.pull_request.number }}'
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read
concurrency:
  group: ai-review-gate-check-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  verify:
    name: AI review gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted default-branch tooling and metadata; never execute PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { verify } = require('./.github/scripts/review-gate.cjs');
            await verify({ github, context, core });
