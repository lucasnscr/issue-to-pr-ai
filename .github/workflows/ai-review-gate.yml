name: AI review gate reconciler
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR to reconcile using trusted metadata only
        required: true
        type: string
permissions:
  contents: read
# Pending runs may be coalesced. Every run reconciles all open PRs and their
# source comments, preserving commands and same-SHA consistency across requests.
concurrency:
  group: ai-review-gate-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile authorized decisions and publish a commit-bound check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = require('./.github/scripts/review-gate.cjs');
            await run({ github, context, core });
