name: AI review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Same-repository PR number to review (including a draft)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pull_request }}
  # Preserve usage/artifacts for an inference already accepted by the provider.
  # The publisher discards results whose PR SHA has changed.
  cancel-in-progress: false
jobs:
  route-loop:
    if: >-
      vars.AI_ENABLED == 'true' && vars.AI_REVIEW_ENABLED == 'true' && vars.AI_LOOP_ENABLED == 'true' &&
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ai:ready') &&
      contains(github.event.pull_request.labels.*.name, 'ai:autofix')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Route opted-in PR events to the trusted default-branch reviewer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({ ...context.repo,
              workflow_id: 'ai-review.yml', ref: context.payload.repository.default_branch,
              inputs: { pull_request: String(context.payload.pull_request.number) } });
  review:
    if: >-
      vars.AI_ENABLED == 'true' && vars.AI_REVIEW_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ai:ready') &&
        !(vars.AI_LOOP_ENABLED == 'true' && contains(github.event.pull_request.labels.*.name, 'ai:autofix'))))
    runs-on: ${{ fromJSON(vars.AI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    env:
      MODEL: ${{ vars.REVIEW_MODEL || 'anthropic/claude-sonnet-4-6' }}
    steps:
      # Always use trusted tooling; never checkout or execute the PR head here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned OpenCode CLI
        run: npm install --global opencode-ai@1.19.3
      - id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Prepare patch without executing PR code
        id: patch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const number = Number(context.payload.inputs.pull_request);
              if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number.');
              if (context.actor !== 'github-actions[bot]') {
                const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo, username: context.actor,
                });
                if (!['admin', 'maintain', 'write'].includes(access.permission)) {
                  throw new Error('Write access is required for manual AI review.');
                }
              }
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              context.payload.pull_request = pr;
              process.env.ALLOW_DRAFT_REVIEW = 'true';
            }
            const prepare = require('./.github/scripts/review-context.cjs');
            await prepare({ github, context, core });
      - name: Generate review without a GitHub write token
        id: agent
        if: steps.patch.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VLLM_BASE_URL: ${{ vars.VLLM_BASE_URL }}
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          REVIEW_DIRECTORY: ${{ steps.patch.outputs.directory }}
        run: node scripts/run-review.mjs
      - name: Publish advisory review
        if: steps.patch.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_DIRECTORY: ${{ steps.patch.outputs.directory }}
        with:
          script: |
            const publish = require('./.github/scripts/publish-review.cjs');
            await publish({ github, context, core });
      - name: Record execution
        if: always() && steps.started.outcome == 'success'
        env:
          AGENT: opencode-reviewer
          STARTED_AT: ${{ steps.started.outputs.epoch }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: node scripts/run-summary.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.started.outcome == 'success'
        with:
          name: ai-review-${{ github.event.pull_request.number || inputs.pull_request }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
      - name: Continue the opted-in engineering loop
        if: >-
          always() && vars.AI_LOOP_ENABLED == 'true' &&
          github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch &&
          (steps.patch.outcome == 'failure' || steps.agent.outcome == 'failure' || steps.agent.outcome == 'success' ||
           steps.patch.outputs.existing_review_run_id != '')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_SHA: ${{ steps.patch.outputs.sha }}
          REVIEW_RUN_ID: ${{ steps.patch.outputs.existing_review_run_id }}
        with:
          script: |
            const { dispatch } = require('./.github/scripts/engineering-loop.cjs');
            await dispatch({ github, context, core });
