name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/tests/*.test.cjs
      - name: Validate configuration
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt
          .venv/bin/python scripts/validate_config.py
          docker compose config --quiet
          kubectl kustomize infra/kubernetes/application > /dev/null
          kubectl kustomize infra/kubernetes/inference > /dev/null
      - name: Lint GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and PostgreSQL integration tests
        run: ./mvnw -B -ntp verify
      - name: Build application container
        run: docker build -t catalog-api:0.1.0 .
      - name: Full application HTTP acceptance
        run: |
          trap 'docker compose logs --no-color; docker compose down -v' EXIT
          docker compose up --no-build -d
          node scripts/smoke.mjs
          node scripts/category-acceptance.mjs
          node scripts/price-acceptance.mjs
          node scripts/ordering-acceptance.mjs
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            apps/catalog-api/target/surefire-reports/
            apps/catalog-api/target/failsafe-reports/
            apps/catalog-api/target/site/jacoco/
          retention-days: 14
