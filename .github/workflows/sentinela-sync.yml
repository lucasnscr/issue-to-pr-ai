name: Sentinela PR synchronization
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  notify:
    if: vars.SENTINELA_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Notify from trusted code without candidate checkout or artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SENTINELA_ENABLED: 'true'
          SENTINELA_URL: ${{ vars.SENTINELA_URL }}
          SENTINELA_SERVICE: ${{ vars.SENTINELA_SERVICE }}
          SENTINELA_ENVIRONMENT: ${{ vars.SENTINELA_ENVIRONMENT }}
          SENTINELA_CALLBACK_TOKEN: ${{ secrets.SENTINELA_CALLBACK_TOKEN }}
        run: node scripts/sentinela/notify-pr.mjs
