apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-private
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-runners
      ports:
        - protocol: TCP
          port: 8000
